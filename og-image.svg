<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8BD2C"/>
      <stop offset="100%" stop-color="#FFD24C"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(232,189,44,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Big monogram M -->
  <text x="120" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="380" font-weight="900" fill="url(#accent)" style="letter-spacing: -0.05em">M</text>

  <!-- Title -->
  <text x="120" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="60" font-weight="800" fill="#f0f0f0" style="letter-spacing: -0.02em">Meme Codex</text>

  <!-- Subtitle -->
  <text x="120" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="500" fill="#888">A Visual Encyclopedia of Internet Memes</text>

  <!-- Stats row -->
  <g transform="translate(680, 380)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="800" fill="#E8BD2C" style="letter-spacing: -0.02em">107</text>
    <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#888" style="letter-spacing: 0.1em">MEMES</text>

    <text x="170" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="800" fill="#E8BD2C" style="letter-spacing: -0.02em">16+</text>
    <text x="170" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#888" style="letter-spacing: 0.1em">COUNTRIES</text>

    <text x="370" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="800" fill="#E8BD2C" style="letter-spacing: -0.02em">4</text>
    <text x="370" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#888" style="letter-spacing: 0.1em">ERAS</text>
  </g>

  <!-- Year range badge -->
  <rect x="680" y="480" width="160" height="50" rx="6" fill="rgba(232,189,44,0.15)" stroke="rgba(232,189,44,0.4)" stroke-width="1"/>
  <text x="760" y="513" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#E8BD2C" text-anchor="middle">2007 — 2026</text>

  <!-- URL badge -->
  <text x="120" y="595" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="500" fill="#666">zuttohimadakara-art.github.io/quickfire</text>
</svg>
