<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Meme Not Found | Meme Codex</title>
  <meta name="description" content="This meme hasn't been catalogued yet. Browse the Meme Codex to find the meme you're looking for.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://getquickfire.com/">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>📖</text></svg>">
  <style>
    .notfound-wrap { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4rem 1.5rem; text-align: center; }
    .notfound-code { font-size: clamp(5rem, 14vw, 9rem); font-weight: 800; line-height: 1; margin: 0 0 0.5rem; background: linear-gradient(135deg, var(--accent, #ff3b6b), #ff8a3b); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .notfound-title { font-size: clamp(1.5rem, 4vw, 2.25rem); margin: 0 0 1rem; }
    .notfound-body { max-width: 36rem; color: var(--muted, #a4a4b0); margin: 0 auto 2rem; }
    .notfound-cta { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.85rem 1.5rem; border-radius: 999px; background: var(--accent, #ff3b6b); color: white; text-decoration: none; font-weight: 600; }
    .notfound-cta:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <main class="notfound-wrap">
    <p class="notfound-code">404</p>
    <h1 class="notfound-title">This meme hasn't been catalogued yet.</h1>
    <p class="notfound-body">The page you're looking for either moved, never existed, or got removed in our last codex sweep. Head back to the encyclopedia to find the meme you were after.</p>
    <a class="notfound-cta" href="/">Browse the codex →</a>
  </main>
</body>
</html>
